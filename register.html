<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buat Akun | Griya Madu</title><link rel="stylesheet" href="style.css"><script defer src="product.js"></script><script defer src="app.js"></script></head>
<body><nav class="nav"><div class="container navin"><a class="brand" href="index.html"><span class="brandmark">GM</span><span>Griya Madu<small>SINGOSARI</small></span></a><a class="navbtn" href="login.html">Kembali ke login</a></div></nav>
<main class="container"><section class="panel loginBox"><div class="brandmark" style="margin:0 auto 14px">GM</div><div class="eyebrow">Pelanggan baru</div><h1 style="font:700 29px Georgia,serif">Buat Akun</h1><p class="muted">Pendaftaran membuat akun User baru.</p>
<form class="form" id="registerForm" style="text-align:left;margin-top:20px"><label>Nama lengkap<input id="registerName" autocomplete="name" required></label><label>Username<input id="registerUsername" autocomplete="username" minlength="3" required></label><label>Email<input id="registerEmail" type="email" autocomplete="email" required></label><label>Kata sandi<input id="registerPassword" type="password" autocomplete="new-password" minlength="6" required></label><label>Ulangi kata sandi<input id="registerConfirm" type="password" autocomplete="new-password" minlength="6" required></label><button class="btn primary" type="submit">Daftar</button><p id="registerError" class="muted hidden" role="alert" style="color:#a33424;margin:0"></p></form>
<p class="muted" style="font-size:11px;margin-top:16px">Akun dan kata sandi disimpan di localStorage browser ini. Ini prototype lokal, bukan pendaftaran akun online.</p></section></main><footer class="footer"><div class="container footerIn"><span>Griya Madu Singosari</span><a href="login.html">Sudah punya akun? Login</a></div></footer></body></html>
