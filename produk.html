<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelola Produk | Griya Madu</title><link rel="stylesheet" href="style.css"><script defer src="product.js"></script><script defer src="app.js"></script></head>
<body><nav class="nav"><div class="container navin"><a class="brand" href="dashboard.html"><span class="brandmark">GM</span><span>Griya Madu<small>AREA PENGELOLA</small></span></a><div class="links"><a href="dashboard.html">Dashboard</a><a href="produk.html">Produk</a><a href="index.html">Toko online</a><a href="profile.html#adminOrders">Cart</a><a href="profile.html">Profil Admin</a></div><a class="navbtn" id="authLink" href="login.html">Masuk</a></div></nav><main class="container section"><div class="sectionHead"><div><div class="eyebrow">Katalog</div><h1 style="font:700 30px Georgia,serif;margin:7px 0">Kelola Produk</h1><p>Perubahan disimpan di penyimpanan browser yang sama dengan MPOS.</p></div></div><div class="panel" style="margin-bottom:18px"><h2 id="productFormTitle" style="font:700 21px Georgia,serif;margin:0 0 15px">Tambah Produk</h2><form class="form" id="productForm"><input id="productId" type="hidden"><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><label>Nama produk<input id="productName" required></label><label>Varian madu<select id="productVariant" required><option value="">Pilih varian madu</option><option>Randu</option><option>Rambutan</option><option>Multiflora</option><option>Riau / Akasia</option><option>Kaliandra</option><option>Lainnya</option></select></label><label>Kategori<select id="productCategory"><option>Madu botol kecil</option><option>Madu botol besar</option><option>Madu jerycan 500ml</option><option>Madu jerycan 1000ml</option></select></label><label>Harga (Rupiah)<input id="productPrice" type="number" min="1" required></label><label>Stok<input id="productStock" type="number" min="0" required></label></div><label>Foto produk<input id="productImageFile" type="file" accept="image/*"></label><div class="row"><button class="btn primary" id="productSubmit" type="submit">Simpan Produk</button><button class="btn light" type="reset" onclick="setTimeout(()=>{document.getElementById('productId').value='';document.getElementById('productFormTitle').textContent='Tambah Produk';document.getElementById('productSubmit').textContent='Simpan Produk'},0)">Kosongkan</button></div></form></div><div class="panel"><h2 style="font:700 21px Georgia,serif;margin:0 0 12px">Daftar Produk</h2><div class="tableWrap"><table><thead><tr><th>Produk</th><th>Varian madu</th><th>Kategori</th><th>Harga</th><th>Stok</th><th>Aksi</th></tr></thead><tbody id="adminProducts"></tbody></table></div></div></main><div id="notice" class="card hidden" style="position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:40"></div><footer class="footer"><div class="container footerIn"><span>Kelola katalog Griya Madu</span><a href="dashboard.html">Kembali ke dashboard</a></div></footer></body></html>
